image: continuumio/miniconda3

stages:
  - lint
  - test
  - build
  - deploy

lint:
  stage: lint
  script:
    - conda install python=3.8 psutil
    - pip install -e .
    - pip install flake8 pep8-naming flake8-docstrings
    - flake8 --config=.flake8 estraces tests setup.py

test:python38:
  stage: test
  script:
    - eval "$(conda shell.bash hook)"
    - conda create -n env-python38 python=3.8 psutil
    - conda activate env-python38
    - python setup.py test -v

test:python39:
  stage: test
  script:
    - eval "$(conda shell.bash hook)"
    - conda create -n env-python39 python=3.9 psutil
    - conda activate env-python39
    - python setup.py test -v

test:python310:
  stage: test
  script:
    - eval "$(conda shell.bash hook)"
    - conda create -n env-python310 python=3.10 psutil
    - conda activate env-python310
    - python setup.py test -v

test:python311:
  stage: test
  script:
    - eval "$(conda shell.bash hook)"
    - conda create -n env-python311 python=3.11 psutil
    - conda activate env-python311
    - python setup.py test -v

build:pypi:
  stage: build
  script:
    - conda install python=3.8
    - pip install -U pip setuptools wheel
    - python setup.py sdist bdist_wheel
  only:
    - tags
  artifacts:
    paths:
      - "dist/*"

deploy:pypi:
  stage: deploy
  only:
    - tags
  when: manual
  script:
    - conda install python=3.8
    - pip install -U pip setuptools wheel twine
    - twine upload --repository-url $PYPI_REPOSITORY dist/*  -u $PYPI_USERNAME -p $PYPI_PWD

build-dev:conda:
  stage: build
  script:
    - cd .recipe
    - conda install conda-build conda-verify
    - conda config --add channels $ANACONDA_CHANNEL
    - conda build --output-folder out dev
  artifacts:
    paths:
      - ".recipe/out/*/*.tar.bz2"

build:conda:
  stage: build
  script:
    - cd .recipe
    - conda install python=3.8 conda-build conda-verify
    - conda config --add channels $ANACONDA_CHANNEL
    - conda build --output-folder out prod
  only:
    - tags
  artifacts:
    paths:
      - ".recipe/out/*/*.tar.bz2"

deploy:conda:
  stage: deploy
  script:
    - cd .recipe
    - conda config --add channels $ANACONDA_CHANNEL
    - conda install anaconda-client
    - anaconda --token "$ANACONDA_TOKEN" upload "out/noarch/estraces*.tar.bz2"
  when: manual
  artifacts:
    paths:
      - ".recipe/out/*/*.tar.bz2"

pages:
  stage: build
  script:
    - conda install python=3.8 psutil
    - pip install -e .
    - cd docs
    - ./build_doc.sh
  artifacts:
    paths:
    - public
  only:
    - tags
