{% set data = load_setup_py_data() %}

package:
  name: estraces-dev
  version: {{ data['version'] }}

source:
  path: ../../

build:
  noarch: python

requirements:
  build:
    - wheel
  host:
    - python {{ python }}
  run:
    - python
    {% for dep in data['install_requires'] %}
    - {{ dep.lower() }}
    {% endfor %}
test:
  imports:
    - estraces
  source_files:
    - tests
  requires:
    - pytest
    - pytest-cov
    - mock
    - memory_profiler >=0.61
    - cloudpickle
  commands:
    - py.test
about:
  home: https://gitlab.com/eshard/estraces
  license: GNU LGPL V3
  license_file: LICENSE
  summary: Traces and trace header set Python library for side-channel analysis.
