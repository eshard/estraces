package:
  name: estraces
  # Version will be determined by setuptools-scm from git tags
  version: {{ environ.get('GIT_DESCRIBE_TAG', '0.0.0').lstrip('v') }}

source:
  path: ../../

build:
  noarch: python
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python >=3.10
    - pip
    - setuptools >=64
    - setuptools-scm >=8
  run:
    - python >=3.11
    - numpy >=2
    - h5py
    - trsfile
    - psutil

about:
  home: https://gitlab.com/eshard/estraces
  license: GNU LGPL V3
  license_file: LICENSE
  summary: Traces and trace header set Python library for side-channel analysis.
